name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v[0-9]+*"
      - "flutter_toolchain-v[0-9]+*"

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: false

      - name: Install Moon
        run: proto install moon

      - name: Install Rust
        run: proto install rust

      - name: Install Rust build components
        run: |
          rustup component add cargo
          rustup target add wasm32-wasip1

      - name: Validate
        run: moon run :ci

      - name: Validate native Flutter example
        run: |
          cargo build --workspace --target wasm32-wasip1
          cd examples/flutter-monorepo
          proto install flutter
          moon query projects
          moon query tasks
          moon run :analyze :test

      - name: Install wabt
        run: sudo apt-get update && sudo apt-get install -y wabt

      - name: Install binaryen
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_121/binaryen-version_121-x86_64-linux.tar.gz | tar xz -C /tmp
          echo "/tmp/binaryen-version_121/bin" >> "$GITHUB_PATH"

      - name: Build WASM plugin (release)
        run: |
          if [[ "$GITHUB_REF_NAME" == flutter_toolchain-v* ]]; then
            cargo build --package flutter_toolchain --target wasm32-wasip1 --release
          else
            cargo build --package flutter_tool --target wasm32-wasip1 --release
          fi

      - name: Optimize and strip
        run: |
          if [[ "$GITHUB_REF_NAME" == flutter_toolchain-v* ]]; then
            artifact="flutter_toolchain"
          else
            artifact="flutter_tool"
          fi
          input="target/wasm32-wasip1/release/$artifact.wasm"
          output="builds/$artifact.wasm"
          mkdir -p builds
          wasm-opt -Os --enable-bulk-memory "$input" --output "$output"
          wasm-strip "$output"
          sha256sum "$output" > "$output.sha256"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: builds/*
          artifactErrorsFailBuild: true
          skipIfReleaseExists: true
