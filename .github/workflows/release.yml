name: Release

on:
  push:
    tags:
      - "v[0-9]+*"
      - "flutter_toolchain-v[0-9]+*"

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          auto-install: false
      - run: proto install moon && proto install rust
      - run: rustup component add cargo rustc rust-std && rustup target add wasm32-wasip1
      - name: Validate
        run: moon run :ci
      - name: Validate native Flutter example
        run: |
          cargo build --locked --workspace --target wasm32-wasip1
          cd examples/flutter-monorepo
          proto install flutter
          moon query projects
          moon query tasks
          moon run :analyze :test
      - name: Install Binaryen securely
        run: |
          archive=/tmp/binaryen-version_121-x86_64-linux.tar.gz
          curl --fail --location --silent --show-error --output "$archive" https://github.com/WebAssembly/binaryen/releases/download/version_121/binaryen-version_121-x86_64-linux.tar.gz
          echo "c90e0e295e8f8484ba5b47da92f26e5d1d18db6cd2fcc0c5cc265a5a73609f17  $archive" | sha256sum --check --strict
          tar xzf "$archive" -C /tmp
          echo "/tmp/binaryen-version_121/bin" >> "$GITHUB_PATH"
      - name: Build and optimize WASM
        run: |
          if [[ "$GITHUB_REF_NAME" == flutter_toolchain-v* ]]; then artifact=flutter_toolchain; else artifact=flutter_tool; fi
          cargo build --locked --package "$artifact" --target wasm32-wasip1 --release
          mkdir -p builds
          wasm-opt -Os --enable-bulk-memory "target/wasm32-wasip1/release/$artifact.wasm" --output "builds/$artifact.wasm"
          wasm-strip "builds/$artifact.wasm"
          sha256sum "builds/$artifact.wasm" > "builds/$artifact.wasm.sha256"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: builds/*.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: builds/*
          if-no-files-found: error
  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: builds
      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: builds/*
          artifactErrorsFailBuild: true
