name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Moon CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: false

      - name: Install Moon
        run: proto install moon

      - name: Install Rust
        run: proto install rust

      - name: Install Rust build components
        run: |
          rustup component add cargo rustc rust-std
          rustup target add wasm32-wasip1

      - run: moon ci :ci

  flutter-monorepo:
    name: Flutter monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: false

      - name: Install Moon
        run: proto install moon

      - name: Install Rust
        run: proto install rust

      - name: Install Rust build components
        run: |
          rustup component add cargo rustc rust-std
          rustup target add wasm32-wasip1

      - name: Build local plugin
        run: moon run :build

      - name: Install Flutter
        working-directory: examples/flutter-monorepo
        run: proto install flutter

      - name: Verify project graphs
        working-directory: examples/flutter-monorepo
        run: |
          proto run --exe dart flutter -- pub workspace list
          moon query projects
          moon query tasks

      - name: Analyze and test
        working-directory: examples/flutter-monorepo
        run: moon run :analyze :test

  moon-forward-compat:
    name: Moon latest compatibility
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: false

      - name: Install Moon
        run: proto install moon

      - name: Install Rust
        run: proto install rust

      - name: Install Rust build components
        run: |
          rustup component add cargo rustc rust-std
          rustup target add wasm32-wasip1

      - run: cargo build --workspace --target wasm32-wasip1

      - name: Validate latest stable Moon
        run: proto run moon latest -- run :ci
