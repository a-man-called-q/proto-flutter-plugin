name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Moon CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          auto-install: false

      - name: Install Moon
        run: proto install moon

      - name: Install Rust
        run: proto install rust

      - name: Install Rust build components
        run: |
          rustup component add cargo rustc rust-std
          rustup target add wasm32-wasip1

      - run: moon ci :ci

  flutter-monorepo:
    name: Flutter monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Moon compares against the base branch on pull requests, which
          # needs more than the default shallow checkout.
          fetch-depth: 0
          filter: blob:none

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          auto-install: false

      - name: Install Moon
        run: proto install moon

      - name: Install Rust
        run: proto install rust

      - name: Install Rust build components
        run: |
          rustup component add cargo rustc rust-std
          rustup target add wasm32-wasip1

      - name: Build local plugin
        run: moon run :build

      - name: Verify Proto 0.62 compatibility
        working-directory: examples/flutter-monorepo
        run: |
          proto --version
          proto versions flutter --aliases

      - name: Install Flutter
        working-directory: examples/flutter-monorepo
        run: proto install flutter

      - name: Verify project graphs
        working-directory: examples/flutter-monorepo
        run: |
          proto run --exe dart flutter -- pub workspace list
          moon query projects
          moon query tasks

      - name: Analyze and test
        working-directory: examples/flutter-monorepo
        run: moon run :analyze :test

      - name: Analyze and test on the minimum supported Moon (2.5.0)
        working-directory: examples/flutter-monorepo
        run: |
          proto install moon 2.5.0
          rm -rf .moon/cache
          proto run moon 2.5.0 -- --version
          proto run moon 2.5.0 -- query projects
          proto run moon 2.5.0 -- run :analyze :test

  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The ignored advisories only affect host-side test dependencies
      # (`wasmtime` through `extism`, and `rsa`), which are not linked into the
      # released WASM artifacts. `wasmtime` is pinned by `extism` upstream and
      # `rsa` has no fixed release. Drop an ID once its crate can be upgraded.
      - name: Audit Proto plugin lockfile
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0222,RUSTSEC-2026-0269,RUSTSEC-2026-0316,RUSTSEC-2026-0327
      - name: Audit Moon toolchain lockfile
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: crates/flutter-toolchain
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0222,RUSTSEC-2026-0269,RUSTSEC-2026-0316,RUSTSEC-2026-0327
