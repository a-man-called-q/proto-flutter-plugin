name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Moon CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          auto-install: false

      - name: Install Moon
        run: proto install moon

      - name: Install Rust
        run: proto install rust

      - name: Install Rust build components
        run: |
          rustup component add cargo rustc rust-std
          rustup target add wasm32-wasip1

      - run: moon ci :ci

  flutter-monorepo:
    name: Flutter monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          auto-install: false

      - name: Install Moon
        run: proto install moon

      - name: Install Rust
        run: proto install rust

      - name: Install Rust build components
        run: |
          rustup component add cargo rustc rust-std
          rustup target add wasm32-wasip1

      - name: Build local plugin
        run: moon run :build

      - name: Install Flutter
        working-directory: examples/flutter-monorepo
        run: proto install flutter

      - name: Verify project graphs
        working-directory: examples/flutter-monorepo
        run: |
          proto run --exe dart flutter -- pub workspace list
          moon query projects
          moon query tasks

      - name: Analyze and test
        working-directory: examples/flutter-monorepo
        run: moon run :analyze :test

  moon-forward-compat:
    name: Moon 2.4.6 compatibility
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          auto-install: false

      - name: Install Moon
        run: proto install moon

      - name: Install Rust
        run: proto install rust

      - name: Install Rust build components
        run: |
          rustup component add cargo rustc rust-std
          rustup target add wasm32-wasip1

      - run: cargo build --locked --workspace --target wasm32-wasip1

      - name: Install Moon 2.4.6
        run: proto install moon 2.4.6

      - name: Validate Moon 2.4.6
        run: proto run moon 2.4.6 -- run :ci

  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
