[package]
name = "flutter_tool"
version = "0.4.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]
resolver = "2"
members = ["crates/flutter-models", "crates/flutter-toolchain"]

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "s"
panic = "abort"

[dependencies]
extism-pdk = "1.3.0"
proto_pdk = "0.28.0"
schematic = { version = "0.18.0", default-features = false, features = ["schema"] }
serde = "1.0.217"
serde_norway = "0.9.42"
flutter_models = { path = "crates/flutter-models" }

[features]
default = ["wasm"]
wasm = []
live-tests = []

[dev-dependencies]
proto_pdk_test_utils = "=0.44.2"
starbase_sandbox = "0.11.0"
tokio = "1.52.0"
