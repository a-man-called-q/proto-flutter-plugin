language: "rust"

tasks:
  format-proto:
    command: "cargo fmt --manifest-path Cargo.toml -- --check"
    inputs:
      - "src/**/*.rs"
      - "crates/flutter-models/**/*.rs"
      - "tests/**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"

  format-toolchain:
    command: "cargo fmt --manifest-path crates/flutter-toolchain/Cargo.toml -- --check"
    inputs:
      - "crates/flutter-toolchain/**/*.rs"
      - "crates/flutter-toolchain/Cargo.toml"
      - "crates/flutter-toolchain/Cargo.lock"

  format:
    deps:
      - "format-proto"
      - "format-toolchain"

  lint-proto:
    command: "cargo clippy --locked --manifest-path Cargo.toml --workspace --all-targets -- -D warnings"
    inputs:
      - "src/**/*.rs"
      - "crates/flutter-models/**/*.rs"
      - "tests/**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"

  lint-toolchain:
    command: "cargo clippy --locked --manifest-path crates/flutter-toolchain/Cargo.toml --target-dir target --all-targets -- -D warnings"
    inputs:
      - "crates/flutter-toolchain/**/*.rs"
      - "crates/flutter-toolchain/Cargo.toml"
      - "crates/flutter-toolchain/Cargo.lock"

  lint:
    deps:
      - "lint-proto"
      - "lint-toolchain"

  build-proto:
    command: "cargo build --locked --manifest-path Cargo.toml --workspace --target wasm32-wasip1"
    inputs:
      - "src/**/*.rs"
      - "crates/flutter-models/**/*.rs"
      - "tests/**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
    outputs:
      - "target/wasm32-wasip1/debug/flutter_tool.wasm"

  build-toolchain:
    command: "cargo build --locked --manifest-path crates/flutter-toolchain/Cargo.toml --target-dir target --target wasm32-wasip1"
    inputs:
      - "crates/flutter-toolchain/**/*.rs"
      - "crates/flutter-toolchain/Cargo.toml"
      - "crates/flutter-toolchain/Cargo.lock"
      - "crates/flutter-models/**/*.rs"
      - "crates/flutter-models/Cargo.toml"
      - "rust-toolchain.toml"
    outputs:
      - "target/wasm32-wasip1/debug/flutter_toolchain.wasm"

  build:
    deps:
      - "build-proto"
      - "build-toolchain"

  test-proto:
    command: "cargo test --locked --manifest-path Cargo.toml --workspace --all-targets"
    deps:
      - "build-proto"
    inputs:
      - "src/**/*.rs"
      - "crates/flutter-models/**/*.rs"
      - "tests/**/*"
      - "Cargo.toml"
      - "Cargo.lock"

  test-toolchain:
    command: "cargo test --locked --manifest-path crates/flutter-toolchain/Cargo.toml --target-dir target --all-targets"
    deps:
      - "build-toolchain"
    inputs:
      - "crates/flutter-toolchain/**/*.rs"
      - "crates/flutter-toolchain/Cargo.toml"
      - "crates/flutter-toolchain/Cargo.lock"
      - "crates/flutter-models/**/*.rs"
      - "crates/flutter-models/Cargo.toml"

  test:
    deps:
      - "test-proto"
      - "test-toolchain"

  ci:
    deps:
      - "format"
      - "lint"
      - "test"
