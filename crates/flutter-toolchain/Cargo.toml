[package]
name = "flutter_toolchain"
version = "0.4.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
extism-pdk = "=1.4.1"
moon_common = "=2.0.7"
moon_config = "=2.1.0"
moon_pdk = { version = "=2.0.4", features = ["schematic"] }
moon_pdk_api = "=2.0.4"
moon_target = "=3.0.0"
schematic = { version = "=0.19.7", default-features = false, features = ["config"] }
serde = { version = "1.0.228", features = ["derive"] }
flutter_models = { path = "../flutter-models" }
serde_norway = "0.9.42"

[dev-dependencies]
moon_pdk_test_utils = "=2.0.4"
serde_json = "1.0.151"
starbase_sandbox = "0.11.0"
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread"] }

[features]
default = ["wasm"]
wasm = []
